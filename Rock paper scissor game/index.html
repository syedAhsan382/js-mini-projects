<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock paper Scissors game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Rock paper sicissors game</h1>

    <div class="buttons-row">
        <button class="move-button js-rock-button"><img src="Images/rock-emoji.png" class="move-icon"></button> <!--ROCK BUTTON-->

        <button class="move-button js-paper-button"><img src="Images/paper-emoji.png"class="move-icon"></button> <!--PAPER BUTTON-->

        <button class="move-button js-scissors-button"><img src="Images/scissors-emoji.png" class="move-icon"></button> <!--SICISSORS BUTTON-->

    </div>


    

    <p class="js-result result"></p>
    <p class="js-moves"></p>    
    <p class="js-score score"></p>

    <div class="control-button">
        <button onclick=" updateScoreElement()" class="reset-score-button">Reset score</button>

        <button class="auto-play-button">Auto play</button>



    </div>

    <div>
        <p class="controls-hint">⌨️ Keyboard: R = Rock, P = Paper, S = Scissors, A = Auto play, Backspace = Reset score</p>

       
    </div>

   



    <script src="rps.js"></script>
     


</body>
</html>
